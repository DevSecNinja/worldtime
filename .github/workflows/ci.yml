---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check, test, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore checksummed reference data
        run: npm run data:bootstrap

      - name: Type check
        run: npm run check

      - name: Run unit and integration tests
        run: npm run test:run -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Publish test results
        if: always()
        uses: DevSecNinja/.github/actions/test-report@5452dbd33d61b4fc58b1780f57e0b60ff131be75 # v4.10.0
        with:
          paths: test-results.xml
          title: vitest

      - name: Build production PWA
        run: npm run build
