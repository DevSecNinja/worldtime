---
name: Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - closed
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Close-event handoff
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: echo "No build is required while the reusable workflow removes the preview."

      - name: Checkout
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: npm ci

      - name: Install Playwright browsers
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test and build
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: |
          npm test
          npm run test:e2e
          npm run build

      - name: Upload site artifact
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worldtime-site
          path: dist
          if-no-files-found: error

  pages:
    needs: build
    uses: DevSecNinja/.github/.github/workflows/pages.yml@24acc67adf1be33089e73b2fdbdb4be8c12d145b # v3.2.0
    permissions:
      contents: read
      deployments: write # Records Cloudflare production and preview deployments.
      issues: write # Updates the Cloudflare preview comment.
      pull-requests: write # Updates the Cloudflare preview comment.
    with:
      # renovate: datasource=node-version depName=node
      node-version: "24"
      # renovate: datasource=npm depName=wrangler
      wrangler-version: "4.128.0"
      artifact-path: dist
      artifact-name: worldtime-site
      install-command: ""
      github-pages: false
      cloudflare-preview: true
      cloudflare-production: true
      cloudflare-project-name: worldtime
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
