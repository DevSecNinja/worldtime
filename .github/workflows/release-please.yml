---
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@231c380d4f75486e159ed2e3d806bc76ff193a43 # v4.7.0
    permissions:
      contents: write # Creates release branches, commits, tags, and releases.
      pull-requests: write # Opens and updates the release pull request.
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
